<sbb-form-field>
  <label>Field label</label>
  <sbb-chip-group name="field-name" [formField]="form.model">
    <input placeholder="Type and press enter." />
    <sbb-autocomplete>
      @for (option of availableOptions(); track option) {
        <sbb-option [value]="option">{{ option }}</sbb-option>
      }
    </sbb-autocomplete>
  </sbb-chip-group>
</sbb-form-field>
