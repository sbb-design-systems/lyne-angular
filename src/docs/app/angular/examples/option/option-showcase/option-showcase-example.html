<sbb-notification animation="none">
  The `&lt;sbb-option&gt;` component is primarily intended for use within a select or autocomplete.
  This example showcases only its basic functionality.
</sbb-notification>

<p>
  <sbb-option [disabled]="controls.disabled().value()">Option label</sbb-option>

  <sbb-option [disabled]="controls.disabled().value()" iconName="circle-information-small">
    Option label
  </sbb-option>
</p>

<sbb-title level="5">Properties</sbb-title>
<div class="sbb-controls-table">
  <label for="disabled">Disabled</label>
  <sbb-checkbox id="disabled" [formField]="controls.disabled"></sbb-checkbox>
</div>
