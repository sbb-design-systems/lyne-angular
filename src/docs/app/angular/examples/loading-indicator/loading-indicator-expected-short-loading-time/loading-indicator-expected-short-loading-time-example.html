<sbb-secondary-button (click)="loadData()">Load data </sbb-secondary-button>

@if (loading()) {
  <sbb-loading-indicator></sbb-loading-indicator>
} @else if (dataAvailable()) {
  <p>Data successfully loaded</p>
}

<p>
  Here's an example of how to delay the loading indicator until one second has elapsed since the
  action started. <br />
  This avoids showing the indicator immediately for short loading states.
</p>
