<sbb-train-formation [view]="controls.view().value()">
  <sbb-train
    directionLabel="Direction of travel"
    station="Bern"
    direction="left"
    accessibilityLabel="The top of the train is in Sector A. The train leaves the station in this direction"
  >
    <sbb-train-wagon
      wagonType="locomotive"
      additionalAccessibilityText="Top of the train"
      sector="A"
    ></sbb-train-wagon>
    <sbb-train-wagon wagonType="closed" sector="A" label="37"></sbb-train-wagon>
    <sbb-train-blocked-passage></sbb-train-blocked-passage>
    <sbb-train-wagon
      wagonType="wagon"
      label="38"
      occupancy="low"
      blockedPassage="previous"
      wagonClass="1"
      sector="A"
    >
      <sbb-icon aria-hidden="false" aria-label="wheelchair space" name="sa-rs"></sbb-icon>
      <sbb-icon aria-hidden="false" aria-label="low-floor entry" name="sa-nf"></sbb-icon>
      <sbb-icon
        aria-hidden="false"
        aria-label="Business zone in 1st class: Reservation possible"
        name="sa-bz"
      ></sbb-icon>
      <sbb-icon
        aria-hidden="false"
        aria-label="Business zone in 1st class: Reservation possible"
        name="sa-bz"
      ></sbb-icon>
    </sbb-train-wagon>
    <sbb-train-wagon wagonType="wagon" label="39" occupancy="none" wagonClass="1" sector="B">
      <sbb-icon aria-hidden="false" aria-label="low-floor entry" name="sa-nf"></sbb-icon>
    </sbb-train-wagon>
    <sbb-train-wagon wagonType="restaurant" label="40" sector="B">
      <sbb-icon aria-hidden="false" aria-label="wheelchair space" name="sa-rs"></sbb-icon>
    </sbb-train-wagon>
    <sbb-train-wagon wagonType="wagon" label="41" occupancy="high" wagonClass="2" sector="B">
      <sbb-icon aria-hidden="false" aria-label="low-floor entry" name="sa-nf"></sbb-icon>
    </sbb-train-wagon>
    <sbb-train-wagon
      wagonType="wagon"
      label="42"
      occupancy="low"
      wagonClass="2"
      blockedPassage="next"
      sector="C"
    >
      <sbb-icon aria-hidden="false" aria-label="low-floor entry" name="sa-nf"></sbb-icon>
    </sbb-train-wagon>
    <sbb-train-blocked-passage></sbb-train-blocked-passage>
    <sbb-train-wagon
      wagonType="wagon"
      label="43"
      occupancy="low"
      wagonClass="2"
      blockedPassage="both"
      sector="C"
    >
      <sbb-icon
        aria-hidden="false"
        aria-label="stroller space"
        name="sa-abteilkinderwagen"
      ></sbb-icon>
      <sbb-icon aria-hidden="false" aria-label="low-floor entry" name="sa-nf"></sbb-icon>
    </sbb-train-wagon>
    <sbb-train-blocked-passage></sbb-train-blocked-passage>
    <sbb-train-wagon
      blockedPassage="previous"
      wagonType="wagon"
      label="44"
      occupancy="low"
      wagonClass="2"
      sector="C"
    >
      <sbb-icon aria-hidden="false" aria-label="low-floor entry" name="sa-nf"></sbb-icon>
      <sbb-icon aria-hidden="false" aria-label="Family zone" name="sa-fz"></sbb-icon>
    </sbb-train-wagon>
    <sbb-train-wagon
      wagonType="wagon"
      label="45"
      occupancy="low"
      wagonClass="2"
      sector="D"
    ></sbb-train-wagon>
    <sbb-train-wagon wagonType="couchette" label="46" sector="D"></sbb-train-wagon>
    <sbb-train-wagon
      wagonType="sleeping"
      label="47"
      additionalAccessibilityText="End of the train"
      sector="D"
      blockedPassage="next"
    ></sbb-train-wagon>
    <sbb-train-blocked-passage></sbb-train-blocked-passage>
  </sbb-train>

  <sbb-train
    directionLabel="Direction of travel"
    station="Luzern"
    direction="left"
    accessibilityLabel="The top of the train is in Sector E. The train leaves the station in this direction"
  >
    <sbb-train-wagon
      wagonType="wagon-end-left"
      additionalAccessibilityText="Top of the train"
      blockedPassage="previous"
      occupancy="none"
      wagonClass="2"
      sector="E"
    ></sbb-train-wagon>
    <sbb-train-wagon
      wagonType="wagon"
      label="50"
      occupancy="low"
      wagonClass="2"
      sector="E"
    ></sbb-train-wagon>
    <sbb-train-wagon-button
      wagonType="wagon"
      label="51"
      occupancy="low"
      wagonClass="2"
      sector="F (buttons)"
    ></sbb-train-wagon-button>
    <sbb-train-wagon-button
      wagonType="wagon"
      label="52"
      occupancy="low"
      wagonClass="2"
      sector="F (buttons)"
    ></sbb-train-wagon-button>
    <sbb-train-wagon-button
      wagonType="wagon"
      label="53"
      occupancy="low"
      wagonClass="2"
      sector="F (buttons)"
    ></sbb-train-wagon-button>
    <sbb-train-wagon-link
      wagonType="wagon"
      label="54"
      occupancy="low"
      wagonClass="2"
      sector="G (links)"
      routerLink="./"
    ></sbb-train-wagon-link>
    <sbb-train-wagon-link
      wagonType="wagon"
      label="55"
      occupancy="low"
      wagonClass="2"
      sector="G (links)"
      routerLink="./"
    ></sbb-train-wagon-link>
    <sbb-train-wagon-link
      wagonType="wagon"
      label="56"
      occupancy="low"
      wagonClass="2"
      sector="G (links)"
      routerLink="./"
    ></sbb-train-wagon-link>
  </sbb-train>
</sbb-train-formation>

<sbb-title level="5">Properties</sbb-title>
<div class="sbb-controls-table">
  <label>View</label>
  <sbb-radio-button-group aria-label="View" [formField]="controls.view">
    <sbb-radio-button value="side">side</sbb-radio-button>
    <sbb-radio-button value="top">top</sbb-radio-button>
  </sbb-radio-button-group>
</div>
