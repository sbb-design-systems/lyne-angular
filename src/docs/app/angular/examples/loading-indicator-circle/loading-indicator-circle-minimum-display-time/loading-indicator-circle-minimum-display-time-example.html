<sbb-secondary-button (click)="loadData()"> Load data </sbb-secondary-button>

@if (loading()) {
  <sbb-loading-indicator-circle></sbb-loading-indicator-circle>
}

@if (dataAvailable()) {
  <p>Data successfully loaded</p>
}

<p>
  Here's an example of how to implement a minimum display time for the loading indicator. <br />
  It will be displayed for at least 500 milliseconds, even if the API call completes faster than
  that.
</p>
