<sbb-toggle-check
  [formField]="controls.checked"
  [size]="controls.size().value()"
  [labelPosition]="controls.labelPosition().value()"
  [iconName]="controls.withCustomIcon().value() ? 'eye-small' : ''"
>
  {{ controls.withLabel().value() ? 'Label' : null }}
</sbb-toggle-check>

<sbb-title level="5">Properties</sbb-title>
<div class="sbb-controls-table">
  <label>Size</label>
  <sbb-radio-button-group aria-label="Size" [formField]="controls.size" allowEmptySelection>
    <sbb-radio-button value="xs">xs</sbb-radio-button>
    <sbb-radio-button value="s">s</sbb-radio-button>
    <sbb-radio-button value="m">m</sbb-radio-button>
  </sbb-radio-button-group>

  <label for="checked">Checked</label>
  <sbb-checkbox id="checked" [formField]="controls.checked"></sbb-checkbox>

  <label for="disabled">Disabled</label>
  <sbb-checkbox id="disabled" [formField]="controls.disabled"></sbb-checkbox>

  <label for="with-label">With label</label>
  <sbb-checkbox id="with-label" [formField]="controls.withLabel"></sbb-checkbox>

  <label>Label position</label>
  <sbb-radio-button-group aria-label="Label position" [formField]="controls.labelPosition">
    <sbb-radio-button value="before">before</sbb-radio-button>
    <sbb-radio-button value="after">after</sbb-radio-button>
  </sbb-radio-button-group>

  <label for="has-custom-icon">With custom icon</label>
  <sbb-checkbox id="has-custom-icon" [formField]="controls.withCustomIcon"></sbb-checkbox>
</div>
