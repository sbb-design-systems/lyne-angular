<sbb-tag-group accessibilityLabel="Select your desired devices" multiple [formGroup]="form">
  <sbb-tag formControlName="computers">Computers</sbb-tag>
  <sbb-tag formControlName="phones">Phones</sbb-tag>
</sbb-tag-group>
<p>
  <sbb-card color="milk">
    Values: <code>{{ form.value | json }}</code>
  </sbb-card>
</p>
